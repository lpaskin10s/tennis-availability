<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSRC Early Birds — Tennis Availability</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Early Birds">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#142B3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court-navy: #142B3D;
    --court-navy-deep: #0B1B28;
    --panel: #1B3A50;
    --ball-yellow: #D7F23C;
    --ball-yellow-dim: #A9C22C;
    --chalk: #F2F5F0;
    --clay: #C1502B;
    --clay-dim: #8F3C20;
    --net-gray: #8CA0AF;
    --line: rgba(242,245,240,0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--court-navy);
    color: var(--chalk);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding: 0 0 60px 0;
  }

  .header {
    background: var(--court-navy-deep);
    border-bottom: 2px solid var(--line);
    padding: 28px 20px 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: "";
    position: absolute;
    top: -60%;
    left: 50%;
    transform: translateX(-50%);
    width: 140%;
    height: 220%;
    border: 2px solid var(--line);
    border-radius: 50%;
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--ball-yellow);
    position: relative;
  }

  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(28px, 6vw, 42px);
    margin: 6px 0 4px;
    letter-spacing: -0.01em;
    position: relative;
  }

  .week-range {
    color: var(--net-gray);
    font-size: 14px;
    font-family: 'Space Mono', monospace;
    position: relative;
  }

  .admin-pill {
    display: inline-block;
    margin-top: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    background: var(--clay);
    color: var(--chalk);
    padding: 3px 10px;
    border-radius: 100px;
    position: relative;
  }

  .version-tag {
    margin-top: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--net-gray);
    opacity: 0.6;
    position: relative;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 16px 0;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 24px;
  }

  .card.admin-card {
    border-color: var(--clay-dim);
  }

  .card h2 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card h2 .tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    background: var(--ball-yellow);
    color: var(--court-navy-deep);
    padding: 3px 8px;
    border-radius: 100px;
    letter-spacing: 0.05em;
  }

  .card h2 .tag.admin {
    background: var(--clay);
    color: var(--chalk);
  }

  .card h2 .tag.subtle {
    background: var(--court-navy-deep);
    color: var(--net-gray);
    font-weight: 400;
    margin-left: auto;
  }

  .card h2 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  label.field-label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--net-gray);
    margin-bottom: 8px;
    font-weight: 600;
  }

  input[type="text"], textarea, select {
    width: 100%;
    background: var(--court-navy-deep);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    margin-bottom: 18px;
  }

  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ball-yellow) 50%), linear-gradient(135deg, var(--ball-yellow) 50%, transparent 50%);
    background-position: calc(100% - 20px) center, calc(100% - 15px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    cursor: pointer;
  }

  select option { background: var(--court-navy-deep); color: var(--chalk); }

  input[type="text"]:focus, textarea:focus, select:focus, button:focus-visible, .day-chip:focus-visible {
    outline: 2px solid var(--ball-yellow);
    outline-offset: 2px;
  }

  textarea { resize: vertical; min-height: 54px; }

  .day-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }

  .day-chip {
    background: var(--court-navy-deep);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    color: var(--chalk);
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .day-chip:hover { border-color: var(--ball-yellow-dim); }

  .day-chip .dow {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--net-gray);
    display: block;
  }

  .day-chip .dnum {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    display: block;
    margin-top: 2px;
  }

  .day-chip.selected {
    background: var(--ball-yellow);
    border-color: var(--ball-yellow);
    transform: translateY(-2px);
  }

  .day-chip.selected .dow, .day-chip.selected .dnum { color: var(--court-navy-deep); }

  .day-chip.disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  .day-chip.closed-chip {
    opacity: 1;
    pointer-events: none;
    background: repeating-linear-gradient(45deg, var(--court-navy-deep), var(--court-navy-deep) 4px, #1f2f3a 4px, #1f2f3a 8px);
    border-color: var(--clay-dim);
  }
  .day-chip.closed-chip .dow, .day-chip.closed-chip .dnum { color: var(--clay); }

  .day-chip.admin-select.selected {
    background: var(--clay);
    border-color: var(--clay);
  }
  .day-chip.admin-select.selected .dow, .day-chip.admin-select.selected .dnum { color: var(--chalk); }

  .snapshot-card {
    background: var(--court-navy-deep);
    border: 1px solid var(--ball-yellow-dim);
    border-radius: 10px;
    padding: 12px 16px;
    margin: -6px 0 18px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 12px;
  }
  .snapshot-card .lbl {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--net-gray);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .snapshot-card .val {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    color: var(--ball-yellow);
    white-space: nowrap;
  }

  .out-toggle {
    display: block;
    width: 100%;
    background: var(--court-navy-deep);
    border: 1px solid var(--line);
    color: var(--net-gray);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 18px;
    transition: all 0.15s ease;
  }
  .out-toggle:hover { border-color: var(--clay-dim); }
  .out-toggle.active {
    background: var(--clay);
    border-color: var(--clay);
    color: var(--chalk);
    font-weight: 700;
  }

  .payment-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  .payment-row .payment-name { flex: 1; font-size: 13px; }
  .payment-row input {
    width: 72px;
    margin-bottom: 0;
    padding: 6px 8px;
    font-size: 13px;
    text-align: right;
  }
  .payment-row .payment-label { font-size: 10px; color: var(--net-gray); font-family: 'Space Mono', monospace; }

  .out-badge {
    display: inline-block;
    margin-left: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--clay);
    border: 1px solid var(--clay);
    border-radius: 4px;
    padding: 1px 5px;
    vertical-align: middle;
  }
  tr.is-out { opacity: 0.55; }
  tr.is-self { background: rgba(215,242,60,0.08); }
  tr.is-self .name-col { color: var(--ball-yellow); font-weight: 700; }

  button.primary {
    background: var(--ball-yellow);
    color: var(--court-navy-deep);
    border: none;
    font-family: 'Archivo Black', sans-serif;
    font-size: 14px;
    padding: 13px 22px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    letter-spacing: 0.02em;
    transition: transform 0.1s ease;
  }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  button.admin-btn {
    background: var(--clay);
    color: var(--chalk);
  }

  .status-msg {
    margin-top: 10px;
    font-size: 13px;
    color: var(--ball-yellow);
    font-family: 'Space Mono', monospace;
    min-height: 16px;
  }
  .status-msg.admin-status { color: var(--clay); }

  /* Scoreboard grid */
  .scoreboard-scroll { overflow-x: auto; }
  table.scoreboard {
    width: 100%;
    border-collapse: collapse;
    min-width: 680px;
  }
  table.scoreboard th, table.scoreboard td {
    padding: 10px 6px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  table.scoreboard th.name-col, table.scoreboard td.name-col {
    text-align: left;
    padding-left: 4px;
    min-width: 120px;
  }
  table.scoreboard th {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--net-gray);
    text-transform: uppercase;
    font-weight: 400;
  }
  .mark-yes { color: var(--ball-yellow); font-size: 16px; }
  .mark-no { color: var(--net-gray); opacity: 0.4; font-size: 16px; }
  .mark-closed { color: var(--clay); font-size: 11px; font-family: 'Space Mono', monospace; }
  .note-cell { font-size: 11px; color: var(--net-gray); font-style: italic; max-width: 160px; }

  .stamp-row td { border-bottom: none; padding-top: 16px; }
  .stamp {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 5px 9px;
    border-radius: 5px;
    border: 2px solid currentColor;
    transform: rotate(-4deg);
  }
  .stamp.in { color: var(--ball-yellow); }
  .stamp.out { color: var(--clay); border-color: var(--clay); }
  .stamp.closed { color: var(--net-gray); border-color: var(--net-gray); }
  .count-sub { display: block; margin-top: 4px; font-size: 10px; color: var(--net-gray); font-family: 'Space Mono', monospace; }

  .empty-state {
    text-align: center;
    color: var(--net-gray);
    padding: 30px 10px;
    font-size: 14px;
  }

  .best-banner {
    background: var(--court-navy-deep);
    border: 1px solid var(--ball-yellow-dim);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .best-banner .ball {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--ball-yellow);
    flex-shrink: 0;
    position: relative;
    margin-top: 2px;
  }
  .best-banner .ball::after {
    content: "";
    position: absolute; inset: 3px;
    border: 1.5px solid var(--court-navy-deep);
    border-radius: 50%;
    clip-path: inset(0 0 50% 0);
  }
  .best-banner .txt-main { font-family: 'Archivo Black', sans-serif; font-size: 15px; }
  .best-banner .txt-sub { color: var(--net-gray); font-size: 12px; margin-top: 2px; }

  .missing-note {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--clay);
    background: rgba(193,80,43,0.1);
    border: 1px solid var(--clay-dim);
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 14px;
  }
  .missing-note.ok {
    color: var(--ball-yellow);
    background: rgba(215,242,60,0.08);
    border-color: var(--ball-yellow-dim);
  }

  .small-btn {
    display: inline-block;
    background: none;
    border: 1px solid var(--net-gray);
    color: var(--chalk);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 8px;
    vertical-align: middle;
  }
  .small-btn:hover { border-color: var(--ball-yellow); color: var(--ball-yellow); }

  .copy-lineup-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: var(--court-navy-deep);
    border: 1px solid var(--ball-yellow-dim);
    color: var(--ball-yellow);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .copy-lineup-btn:hover { background: rgba(215,242,60,0.08); }

  .footer-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--net-gray);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .link-btn:hover { color: var(--clay); }

  @media (max-width: 520px) {
    .day-grid { gap: 5px; }
    .day-chip { padding: 8px 2px; }
    .day-chip .dnum { font-size: 15px; }
    table.scoreboard { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Tennis Availability</div>
  <h1>NSRC Early Birds</h1>
  <div class="week-range" id="weekRange">—</div>
  <div class="version-tag">v4.11</div>
  <div id="adminPillSlot"></div>
</div>

<div class="wrap">

  <div class="card">
    <h2>Your availability <span class="tag">1 court · need 4</span></h2>
    <label class="field-label" for="nameInput">Your name</label>
    <select id="nameInput">
      <option value="" disabled selected>Choose your name…</option>
    </select>
    <input type="text" id="subNameInput" placeholder="Sub's name" style="display:none;">
    <div id="personalSnapshotSlot"></div>

    <label class="field-label">Days you can play this week</label>
    <div class="day-grid" id="dayGrid"></div>
    <button type="button" class="out-toggle" id="outToggle">I'm out this week</button>

    <label class="field-label" for="noteInput">Notes (optional)</label>
    <textarea id="noteInput" placeholder="e.g. only after 6pm, can sub last minute"></textarea>

    <label class="field-label" for="maxStreakInput">Max days in a row (optional)</label>
    <input type="text" inputmode="numeric" id="maxStreakInput" placeholder="e.g. 2 — leave blank for no limit">

    <label class="field-label" for="maxWeeklyInput">Max days to play this week (optional)</label>
    <input type="text" inputmode="numeric" id="maxWeeklyInput" placeholder="e.g. 3 — even if you marked more days available">

    <button class="primary" id="submitBtn">Save my availability</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="card">
    <h2>This week's board <span class="tag subtle" id="lastRefreshedTag">Loading…</span></h2>
    <div id="missingSlot"></div>
    <div id="bestBannerSlot"></div>
    <div class="scoreboard-scroll">
      <table class="scoreboard" id="scoreboard">
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr id="countRow"></tr>
          <tr class="stamp-row" id="stampRow"></tr>
        </tfoot>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">No responses yet this week. Be the first to send yours in above.</div>
  </div>

  <div id="adminCardSlot"></div>

  <div style="text-align:center; margin: 30px 0 10px;">
    <a href="stats.html" style="color:var(--net-gray); opacity:0.5; font-size:11px; font-family:'Space Mono',monospace; text-decoration:underline;">📊 Season Stats</a>
    <a href="demand.html" style="color:var(--net-gray); opacity:0.5; font-size:11px; font-family:'Space Mono',monospace; text-decoration:underline; margin-left:10px;">📈 Demand Patterns</a>
  </div>

  <div style="text-align:center; margin: 10px 0 10px;">
    <button type="button" id="adminSigninBtn" style="background:none;border:none;color:var(--net-gray);opacity:0.35;font-size:11px;font-family:'Space Mono',monospace;cursor:pointer;">Admin</button>
    <button type="button" id="adminExitBtn" style="display:none;background:none;border:none;color:var(--net-gray);opacity:0.35;font-size:11px;font-family:'Space Mono',monospace;cursor:pointer;margin-left:10px;">Exit admin mode</button>
  </div>

</div>

<script>
(function() {
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let PLAYERS = []; // populated from the backend once the first load completes
  const DEFAULT_PLAYERS_FALLBACK = ['Alex','Billy','Bob','Greg','Igal','Joe','Lewis','Peter'];
  let playersInitialized = false;
  const API_URL = '/api/availability';
  const VAPID_PUBLIC_KEY = 'BGsWtB6zkEL-X2Agy3pIeFZ0IcJA_P9AAppXnJXsw-5CsmTPM-_ckXBdQKgYnbYgn7DXcHIMt3TdF5uEEwkQRtA';

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async function enablePushNotifications() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      throw new Error('Push notifications are not supported in this browser.');
    }
    const registration = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      throw new Error('Notification permission was not granted.');
    }
    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const params = new URLSearchParams({
      action: 'subscribe',
      week: weekKey,
      key: adminKey,
      subscription: JSON.stringify(subscription)
    });
    const res = await fetch(`${API_URL}?${params.toString()}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Failed to save subscription');
  }

  const ADMIN_KEY_STORAGE = 'tennisAdminKeyStored';
  const urlParams = new URLSearchParams(window.location.search);
  let adminKey = urlParams.get('admin');

  if (adminKey) {
    // Remember it on this device so future opens (e.g. from the home-screen
    // icon, which has no address bar to type a link into) can restore it.
    try { localStorage.setItem(ADMIN_KEY_STORAGE, adminKey); } catch (e) { /* ignore */ }
  } else {
    let storedAdminKey = null;
    try { storedAdminKey = localStorage.getItem(ADMIN_KEY_STORAGE); } catch (e) { /* ignore */ }
    if (storedAdminKey) {
      window.location.replace(window.location.pathname + '?admin=' + encodeURIComponent(storedAdminKey));
      return; // page is navigating away; nothing else on this load matters
    }
  }
  const isAdmin = !!adminKey;

  function getWeekStart() {
    // The schedule opens each Saturday for the upcoming Monday–Friday.
    // Returns the most recent Saturday on/before today.
    const today = new Date();
    today.setHours(0,0,0,0);
    const daysSinceSaturday = (today.getDay() + 1) % 7; // Sat=0, Sun=1, Mon=2, ... Fri=6
    const start = new Date(today);
    start.setDate(today.getDate() - daysSinceSaturday);
    return start;
  }

  function getCurrentSeasonYear() {
    // Season runs June 1 through the following May 31 (matches stats.html).
    const today = new Date();
    return today.getMonth() >= 5 ? today.getFullYear() : today.getFullYear() - 1;
  }

  function isoDate(d) {
    return d.toISOString().slice(0,10);
  }

  const weekStart = getWeekStart(); // the opening Saturday

  // Ties in the fairness sort don't break alphabetically (which would always
  // disadvantage the same people, e.g. names late in PLAYERS). Instead, each
  // week gets its own well-mixed shuffle order for tie-breaking, seeded off
  // the week's date so it's deterministic (same for everyone, no memory
  // needed) but not a rigid repeating pattern like a simple rotation would be.
  function hashString(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; }
    return h >>> 0;
  }
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seed) {
    const a = [...arr];
    const rand = mulberry32(seed);
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // comfort estimate — the building has no AC and not much air movement, so

  const CLUB_LATITUDE = 40.2780;
  const CLUB_LONGITUDE = -74.0897;

  function comfortEstimate(feelsLike, humidity) {
    if (feelsLike >= 75 && humidity >= 60) return { emoji: '🥵', text: 'warm & humid indoors likely' };
    if (feelsLike >= 68) return { emoji: '🙂', text: 'could get warm indoors as the morning goes on' };
    if (feelsLike >= 45) return { emoji: '😊', text: 'should feel comfortable indoors' };
    return { emoji: '🥶', text: 'chilly indoors likely — heat may not fully keep up' };

  async function fetchWeather() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const pastDays = weekDays.filter(d => { const dd = new Date(d); dd.setHours(0,0,0,0); return dd.getTime() < today.getTime(); });
    const upcomingDays = weekDays.filter(d => { const dd = new Date(d); dd.setHours(0,0,0,0); return dd.getTime() >= today.getTime(); });

    function applyResult(data) {
      if (!data || !data.hourly || !data.hourly.time) return false;
      const times = data.hourly.time;
      let matchedAny = false;
      weekDays.forEach((d, idx) => {
        // Play runs roughly 6:15/6:30–7:45am; Open-Meteo gives hourly points,
        // so 6:00 and 8:00 are the closest bracketing readings for start/finish.
        const startPrefix = `${isoDate(d)}T06:00`;
        const finishPrefix = `${isoDate(d)}T08:00`;
        const si = times.indexOf(startPrefix);
        const fi = times.indexOf(finishPrefix);
        if (si === -1 && fi === -1) return;
        matchedAny = true;
        const startTemp = si !== -1 ? data.hourly.temperature_2m[si] : null;
        const startFeelsLike = si !== -1 ? data.hourly.apparent_temperature[si] : null;
        const startHumidity = si !== -1 ? data.hourly.relative_humidity_2m[si] : null;
        const finishTemp = fi !== -1 ? data.hourly.temperature_2m[fi] : null;
        const finishFeelsLike = fi !== -1 ? data.hourly.apparent_temperature[fi] : null;
        const finishHumidity = fi !== -1 ? data.hourly.relative_humidity_2m[fi] : null;
        const avgFeelsLike = (startFeelsLike ?? finishFeelsLike ?? 60);
        const avgFeelsLike2 = (startFeelsLike != null && finishFeelsLike != null) ? (startFeelsLike + finishFeelsLike) / 2 : avgFeelsLike;
        const avgHumidity = (startHumidity != null && finishHumidity != null) ? (startHumidity + finishHumidity) / 2 : (startHumidity ?? finishHumidity ?? 50);
        weatherByDay[idx] = {
          startTemp, startFeelsLike, startHumidity,
          finishTemp, finishFeelsLike, finishHumidity,
          comfort: comfortEstimate(avgFeelsLike2, avgHumidity)
        };
      });
      return matchedAny;
    }

    try {
      if (upcomingDays.length > 0) {
        const params = new URLSearchParams({
          latitude: String(CLUB_LATITUDE),
          longitude: String(CLUB_LONGITUDE),
          hourly: 'temperature_2m,relative_humidity_2m,apparent_temperature',
          temperature_unit: 'fahrenheit',
          timezone: 'America/New_York',
          forecast_days: '7'
        });
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
        if (res.ok) {
          const data = await res.json();
          if (!applyResult(data)) console.warn('Forecast weather: no matching timestamps. Sample:', data.hourly && data.hourly.time && data.hourly.time.slice(0, 5));
        } else {
          console.warn('Forecast weather fetch failed:', res.status, await res.text());
        }
      }
      if (pastDays.length > 0) {
        const params = new URLSearchParams({
          latitude: String(CLUB_LATITUDE),
          longitude: String(CLUB_LONGITUDE),
          hourly: 'temperature_2m,relative_humidity_2m,apparent_temperature',
          temperature_unit: 'fahrenheit',
          timezone: 'America/New_York',
          start_date: isoDate(pastDays[0]),
          end_date: isoDate(pastDays[pastDays.length - 1])
        });
        const res = await fetch(`https://archive-api.open-meteo.com/v1/archive?${params.toString()}`);
        if (res.ok) {
          const data = await res.json();
          if (!applyResult(data)) console.warn('Historical weather: no matching timestamps. Sample:', data.hourly && data.hourly.time && data.hourly.time.slice(0, 5));
        } else {
          console.warn('Historical weather fetch failed:', res.status, await res.text());
        }
      }
      if (lastResponses.length > 0 || closedDays.length > 0) renderBoard(lastResponses);
    } catch (e) {
      console.warn('Weather fetch error:', e);
    }
  }

  let rotationMode = 'balanced';

  function assignFairly(responses, mode) {
    const playCount = {};
    const currentStreak = {};
    const lastPlayedIdx = {};
    responses.forEach(r => {
      playCount[r.name] = 0;
      currentStreak[r.name] = 0;
      lastPlayedIdx[r.name] = -99;
    });
    const byName = {};
    responses.forEach(r => { byName[r.name] = r; });

    const dayPlans = weekDays.map((d, idx) => {
      if (closedDays.includes(idx)) {
        return { idx, closed: true, isActual: false, available: [], playing: [], alternates: [], cappedOut: [], eligibleCount: null };
      }

      const available = responses.filter(r => r.days.includes(idx));
      const actualNames = actualResults[String(idx)];

      let playing;
      let isActual = false;
      let cappedOut = [];
      let eligibleCount = null;

      if (actualNames) {
        // Admin has recorded who genuinely played this day — trust that
        // completely over any projection, and use it as ground truth for
        // every later day's streak/weekly counts.
        isActual = true;
        playing = actualNames.map(n => byName[n]).filter(Boolean);
      } else if (available.length < 4) {
        // Not enough people for an actual match — nobody's streak or weekly
        // count should move, since no game is really happening this day.
        playing = [];
      } else {
        // Hard caps: a player's own "max days in a row" / "max days this
        // week" limit is never overridden, even if that leaves the court
        // short of 4. The day is reported honestly as short-staffed instead.
        const wouldExceed = (r) => {
          const streakCap = r.maxstreak;
          const streakIfPlayed = lastPlayedIdx[r.name] === idx - 1 ? currentStreak[r.name] + 1 : 1;
          const streakExceeded = !!streakCap && streakIfPlayed > streakCap;

          const weeklyCap = r.maxweekly;
          const weeklyExceeded = !!weeklyCap && playCount[r.name] >= weeklyCap;

          return streakExceeded || weeklyExceeded;
        };

        const eligible = available.filter(r => !wouldExceed(r));
        cappedOut = available.filter(r => wouldExceed(r));

        const byFairness = (a, b) => {
          // Primary: fewer games played so far this week gets priority.
          const diff = playCount[a.name] - playCount[b.name];
          if (diff !== 0) return diff;
          // Secondary: among people tied on games played, whoever has FEWER
          // REMAINING available days (today onward) gets priority — someone
          // whose only shot this week is today has no other chance if
          // bumped, while someone who's still free on later days can just
          // get picked another day instead. Using remaining (not total)
          // availability matters: a player free all week looks the same on
          // Monday as Friday under a static count, so wide-availability
          // players kept getting front-loaded into early days and burning
          // their weekly cap before the back half of the week — leaving
          // later days short-handed even when people were "available."
          // Counting only days >= idx fixes that by deferring flexible
          // players toward later days instead.
          // "balanced" counts only days from today onward (defers wide-
          // availability players to later days); "classic" counts total
          // weekly availability (the original behavior, tends to front-load
          // wide-availability players into early days).
          const scarcity = (r) => mode === 'classic' ? r.days.length : r.days.filter(d => d >= idx).length;
          const availDiff = scarcity(a) - scarcity(b);
          if (availDiff !== 0) return availDiff;
          // Tertiary: well-mixed weekly shuffle for anyone still tied.
          return (tieRank[a.name] ?? 99) - (tieRank[b.name] ?? 99);
        };

        const provisionalCore = [...eligible.filter(r => !r.isSub)].sort(byFairness).slice(0, 4);
        // Subs are a last resort: they only step in when the non-sub pool
        // alone can't reach 4 that day, and never bump a core player who's
        // available and eligible. If core players alone already fill the
        // court, subs just show up as alternates instead of playing.
        let provisionalPlaying = provisionalCore;
        if (provisionalPlaying.length < 4) {
          const need = 4 - provisionalPlaying.length;
          const sortedSubs = [...eligible.filter(r => r.isSub)].sort(byFairness);
          provisionalPlaying = provisionalPlaying.concat(sortedSubs.slice(0, need));
        }
        // Same rule as plain understaffing: fewer than 4 means no real match
        // happens, so nobody's streak/weekly count should move — even if
        // caps (rather than raw headcount) are what caused the shortfall.
        playing = provisionalPlaying.length >= 4 ? provisionalPlaying : [];
        eligibleCount = eligible.length;
      }

      const alternates = available.filter(r => !playing.includes(r));

      // Advance streak/weekly tracking based on who's actually playing
      // today, whether that came from a real recorded result or a
      // projection — either way it's the best-known truth for today.
      responses.forEach(r => {
        if (playing.includes(r)) {
          currentStreak[r.name] = lastPlayedIdx[r.name] === idx - 1 ? currentStreak[r.name] + 1 : 1;
          lastPlayedIdx[r.name] = idx;
          playCount[r.name]++;
        }
      });

      return { idx, closed: false, isActual, available, playing, alternates, cappedOut, eligibleCount };
    });

    return dayPlans;
  }

  function buildICS(dateObj, startHM, endHM, title, description) {
    const pad = n => String(n).padStart(2, '0');
    const start = new Date(dateObj); start.setHours(startHM[0], startHM[1], 0, 0);
    const end = new Date(dateObj); end.setHours(endHM[0], endHM[1], 0, 0);
    const fmt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    const esc = s => String(s).replace(/([,;])/g, '\\$1');
    return [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//NSRC Early Birds//EN',
      'BEGIN:VEVENT',
      `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@sundaylineup`,
      `DTSTART:${fmt(start)}`,
      `DTEND:${fmt(end)}`,
      `SUMMARY:${esc(title)}`,
      `DESCRIPTION:${esc(description)}`,
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
  }

  function downloadICS(icsText, filename) {
    const blob = new Blob([icsText], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function suggestPairs(playing) {
    if (playing.length !== 4) return null;
    const names = playing.map(r => r.name);
    if (names.includes('Alex') && names.includes('Lewis')) {
      const rest = names.filter(n => n !== 'Alex' && n !== 'Lewis');
      return [['Alex', 'Lewis'], rest];
    }
    // Deterministic fallback (same weekly shuffle order used for tie-breaks)
    // so the suggested pairing doesn't flicker between refreshes.
    const sorted = [...playing].sort((a, b) => (tieRank[a.name] ?? 99) - (tieRank[b.name] ?? 99)).map(r => r.name);
    return [[sorted[0], sorted[1]], [sorted[2], sorted[3]]];
  }

  function buildLineupText(dayPlans) {
    const confirmedDays = dayPlans.filter(plan => !plan.closed && plan.playing.length >= 4);
    if (confirmedDays.length === 0) {
      return `NSRC Early Birds — ${fmtRange()}\n\nNo days have 4 players confirmed yet.`;
    }
    const lines = [`NSRC Early Birds — ${fmtRange()}`, ''];
    confirmedDays.forEach(plan => {
      const d = weekDays[plan.idx];
      const dateLabel = `${DOW[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;
      const startLabel = getStartTime(plan);
      const tag = plan.isActual ? ' (confirmed)' : '';
      const pairs = suggestPairs(plan.playing);
      const pairNote = pairs ? ` [${pairs[0].join(' & ')} vs ${pairs[1].join(' & ')}]` : '';
      lines.push(`${dateLabel} (${startLabel}–${END_TIME_LABEL})${tag}: ${plan.playing.map(r => r.name).join(', ')}${pairNote}`);
    });
    return lines.join('\n');
  }

  function wrapCanvasText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let current = '';
    words.forEach(word => {
      const test = current ? current + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && current) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
    return lines;
  }

  async function generateWeeklyGraphic(dayPlans) {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

    const W = 900;
    const rowH = 150;
    const headerH = 170;
    const footerH = 50;
    const H = headerH + dayPlans.length * rowH + footerH;

    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#142B3D';
    ctx.fillRect(0, 0, W, H);

    // Header
    ctx.fillStyle = '#0B1B28';
    ctx.fillRect(0, 0, W, headerH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#D7F23C';
    ctx.font = '11px "Space Mono", monospace';
    ctx.fillText('TENNIS AVAILABILITY', W / 2, 42);
    ctx.fillStyle = '#F2F5F0';
    ctx.font = '900 42px "Archivo Black", sans-serif';
    ctx.fillText('NSRC Early Birds', W / 2, 95);
    ctx.fillStyle = '#8CA0AF';
    ctx.font = '14px "Space Mono", monospace';
    ctx.fillText(fmtRange(), W / 2, 130);

    // Day rows
    let y = headerH;
    dayPlans.forEach(plan => {
      const d = weekDays[plan.idx];
      const dateLabel = `${DOW[d.getDay()]} ${d.getMonth() + 1}/${d.getDate()}`;
      const rowTop = y;
      ctx.textAlign = 'left';

      ctx.fillStyle = plan.closed ? '#C1502B' : (plan.playing.length >= 4 ? '#D7F23C' : '#8CA0AF');
      ctx.font = '900 22px "Archivo Black", sans-serif';
      ctx.fillText(dateLabel, 40, rowTop + 36);

      let bodyLine1 = '';
      let bodyLine2 = '';
      if (plan.closed) {
        bodyLine1 = 'Club closed';
      } else if (plan.playing.length >= 4) {
        const startLabel = getStartTime(plan);
        bodyLine1 = `${startLabel}–${END_TIME_LABEL}`;
        bodyLine2 = plan.playing.map(r => r.name).join(', ');
      } else if (plan.available.length === 0) {
        bodyLine1 = 'No one available';
      } else {
        bodyLine1 = `Only ${plan.available.length} available (need 4)`;
      }

      ctx.fillStyle = '#8CA0AF';
      ctx.font = '14px "Space Mono", monospace';
      ctx.fillText(bodyLine1, 40, rowTop + 62);

      if (bodyLine2) {
        ctx.fillStyle = '#F2F5F0';
        ctx.font = '18px "Inter", sans-serif';
        const wrapped = wrapCanvasText(ctx, bodyLine2, W - 80);
        wrapped.slice(0, 2).forEach((line, li) => {
          ctx.fillText(line, 40, rowTop + 90 + li * 24);
        });
      }

      if (!plan.closed && plan.playing.length >= 4) {
        const pairs = suggestPairs(plan.playing);
        if (pairs) {
          ctx.fillStyle = '#A9C22C';
          ctx.font = '13px "Space Mono", monospace';
          ctx.fillText(`${pairs[0].join(' & ')} vs ${pairs[1].join(' & ')}`, 40, rowTop + 138);
        }
      }

      const w = weatherByDay[plan.idx];
      if (w && !plan.closed) {
        ctx.textAlign = 'right';
        ctx.fillStyle = '#8CA0AF';
        ctx.font = '13px "Inter", sans-serif';
        const tempStr = (w.startTemp != null && w.finishTemp != null)
          ? `${Math.round(w.startTemp)}°→${Math.round(w.finishTemp)}°F`
          : `${Math.round(w.startTemp ?? w.finishTemp)}°F`;
        ctx.fillText(`${w.comfort.emoji} ${tempStr}`, W - 40, rowTop + 36);
        ctx.textAlign = 'left';
      }

      y += rowH;
      ctx.strokeStyle = 'rgba(242,245,240,0.14)';
      ctx.beginPath();
      ctx.moveTo(40, y - 8);
      ctx.lineTo(W - 40, y - 8);
      ctx.stroke();
    });

    // Footer
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8CA0AF';
    ctx.font = '11px "Space Mono", monospace';
    ctx.fillText('NSRC Early Birds — indoor doubles', W / 2, H - 18);

    return new Promise((resolve, reject) => {
      canvas.toBlob(async blob => {
        if (!blob) { reject(new Error('Could not generate image')); return; }
        const filename = `nsrc-early-birds-${weekKey}.png`;

        // On mobile, the native share sheet lets people go straight to
        // Messages/group text in a couple taps — much faster than downloading
        // and then attaching from Photos. Fall back to a plain download
        // wherever sharing files isn't supported (mainly desktop browsers).
        try {
          const file = new File([blob], filename, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'NSRC Early Birds', text: `This week's lineup — ${fmtRange()}` });
            resolve('shared');
            return;
          }
        } catch (shareErr) {
          if (shareErr && shareErr.name === 'AbortError') { resolve('cancelled'); return; } // user closed the share sheet — not an error
          // any other share failure falls through to the download below
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        resolve('downloaded');
      }, 'image/png');
    });
  }

  function highlightNames(names, selectedName) {
    return names.map(n => n === selectedName
      ? `<strong style="color:var(--ball-yellow);">${escapeHtml(n)}</strong>`
      : escapeHtml(n)
    ).join(', ');
  }

  function renderBoard(responses) {
    const tbody = document.getElementById('tbody');
    const countRow = document.getElementById('countRow');
    const stampRow = document.getElementById('stampRow');
    const emptyState = document.getElementById('emptyState');
    const scoreboard = document.getElementById('scoreboard');
    const bestBannerSlot = document.getElementById('bestBannerSlot');
    const missingSlot = document.getElementById('missingSlot');

    const respondedNames = responses.map(r => r.name);
    const missing = PLAYERS.filter(p => !respondedNames.includes(p));
    missingSlot.innerHTML = missing.length === 0
      ? `<div class="missing-note ok">Everyone's responded! ✅</div>`
      : `<div class="missing-note">Still waiting on: ${escapeHtml(missing.join(', '))}</div>`;

    if (responses.length === 0 && closedDays.length === 0) {
      scoreboard.style.display = 'none';
      emptyState.style.display = 'block';
      bestBannerSlot.innerHTML = '';
      return;
    }
    scoreboard.style.display = 'table';
    emptyState.style.display = 'none';

    const selectedName = (nameSelect.value && nameSelect.value !== '__sub__') ? nameSelect.value : null;

    tbody.innerHTML = responses.map(r => {
      const cells = weekDays.map((d, idx) => {
        if (closedDays.includes(idx)) return '<td><span class="mark-closed">CLOSED</span></td>';
        const has = r.days.includes(idx);
        return `<td>${has ? '<span class="mark-yes">●</span>' : '<span class="mark-no">—</span>'}</td>`;
      }).join('');
      const nameCell = r.out
        ? `${escapeHtml(r.name)}<span class="out-badge">OUT</span>`
        : escapeHtml(r.name);
      const isSelf = selectedName && r.name === selectedName;
      const rowClasses = [r.out ? 'is-out' : '', isSelf ? 'is-self' : ''].filter(Boolean).join(' ');
      return `<tr class="${rowClasses}"><td class="name-col">${nameCell}</td>${cells}<td class="note-cell">${escapeHtml(r.note || '')}</td></tr>`;
    }).join('');

    const counts = weekDays.map((d, idx) => closedDays.includes(idx) ? 0 : responses.filter(r => r.days.includes(idx)).length);

    countRow.innerHTML = '<td class="name-col" style="font-family:\'Space Mono\',monospace;font-size:11px;color:var(--net-gray);">Available</td>' +
      weekDays.map((d, idx) => closedDays.includes(idx)
        ? `<td style="font-family:'Space Mono',monospace;color:var(--net-gray);">—</td>`
        : `<td style="font-family:'Space Mono',monospace;font-weight:700;">${counts[idx]}</td>`
      ).join('') + '<td></td>';

    const dayPlans = assignFairly(responses, rotationMode);

    stampRow.innerHTML = '<td class="name-col"></td>' +
      dayPlans.map(plan => {
        if (plan.closed) {
          return `<td><span class="stamp closed">CLOSED</span><span class="count-sub">club closed</span></td>`;
        }
        const ok = plan.playing.length >= 4;
        let sub;
        if (ok && plan.alternates.length > 0) {
          sub = 'sits out: ' + plan.alternates.map(r => r.name).join(', ');
        } else if (!ok && plan.cappedOut.length > 0) {
          sub = `${plan.available.length} available, but limits leave only ${plan.eligibleCount ?? 0} eligible`;
        } else {
          sub = `${plan.available.length} of ${responses.length}`;
        }
        return `<td><span class="stamp ${ok ? 'in' : 'out'}">${ok ? 'IN' : 'OUT'}</span><span class="count-sub">${escapeHtml(sub)}</span></td>`;
      }).join('') + '<td></td>';

    const playCountTotal = {};
    responses.forEach(r => { playCountTotal[r.name] = 0; });
    dayPlans.forEach(plan => plan.playing.forEach(r => { playCountTotal[r.name]++; }));

    function isDayInPast(plan) {
      // Same 9am cutoff used everywhere else in the app (Season Stats, the
      // personal snapshot) — once the match is over, that day is done, full
      // stop, so it collapses into "earlier this week" just like any other
      // past day rather than staying pinned at the top.
      const CUTOFF_HOUR = 9;
      const now = new Date();
      const todayDateOnly = new Date(now); todayDateOnly.setHours(0, 0, 0, 0);
      const d = weekDays[plan.idx];
      const dayDateOnly = new Date(d); dayDateOnly.setHours(0, 0, 0, 0);
      const isPastDay = dayDateOnly.getTime() < todayDateOnly.getTime();
      const isTodayPastCutoff = dayDateOnly.getTime() === todayDateOnly.getTime() && now.getHours() >= CUTOFF_HOUR;
      return isPastDay || isTodayPastCutoff;
    }

    function renderDayLine(plan) {
      const d = weekDays[plan.idx];
      const dateLabel = `${DOW[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;
      const confirmedTag = plan.isActual ? ` <span style="color:var(--ball-yellow);">✓ confirmed</span>` : '';
      const w = weatherByDay[plan.idx];
      let weatherLine = '';
      if (w && !plan.closed) {
        const tempRange = (w.startTemp != null && w.finishTemp != null)
          ? `${Math.round(w.startTemp)}°F at start → ${Math.round(w.finishTemp)}°F by finish`
          : `${Math.round(w.startTemp ?? w.finishTemp)}°F outside`;
        const feelsLike = w.startFeelsLike != null ? w.startFeelsLike : w.finishFeelsLike;
        const humidity = w.startHumidity != null ? w.startHumidity : w.finishHumidity;
        weatherLine = `<div style="font-size:11px;color:var(--net-gray);margin-top:2px;">${w.comfort.emoji} ${tempRange} (feels like ~${Math.round(feelsLike)}°) · ${Math.round(humidity)}% humidity — ${w.comfort.text} <span style="opacity:0.6;">(estimate)</span></div>`;
      }
      if (plan.closed) {
        return `<div class="txt-sub">${dateLabel}: <span style="color:var(--clay)">club closed</span></div>`;
      }
      if (plan.playing.length >= 4) {
        const startLabel = getStartTime(plan);
        const isSelfPlaying = selectedName && plan.playing.some(r => r.name === selectedName);
        const altNote = plan.alternates.length > 0 ? ` <span style="color:var(--net-gray)">(sitting out: ${highlightNames(plan.alternates.map(r => r.name), selectedName)})</span>` : '';
        const pairs = suggestPairs(plan.playing);
        const pairLine = pairs
          ? `<div style="font-size:11px;color:var(--net-gray);margin:2px 0 4px 0;">Suggested teams: ${escapeHtml(pairs[0].join(' & '))} <span style="color:var(--ball-yellow-dim);">vs</span> ${escapeHtml(pairs[1].join(' & '))}</div>`
          : '';
        const lineStyle = isSelfPlaying ? 'border-left:3px solid var(--ball-yellow); padding-left:8px; background:rgba(215,242,60,0.06); border-radius:4px;' : '';
        return `<div class="txt-sub" style="${lineStyle}"><strong style="color:var(--chalk)">${dateLabel} (${startLabel}–${END_TIME_LABEL}):</strong> ${highlightNames(plan.playing.map(r => r.name), selectedName)}${altNote}${confirmedTag} <button type="button" class="small-btn add-cal-btn" data-idx="${plan.idx}">+ Calendar</button>${pairLine}${weatherLine}</div>`;
      }
      if (plan.available.length === 0) {
        return `<div class="txt-sub">${dateLabel}: no one available${weatherLine}</div>`;
      }
      if (plan.cappedOut.length > 0) {
        return `<div class="txt-sub">${dateLabel}: ${plan.available.length} available, but ${highlightNames(plan.cappedOut.map(r => r.name), selectedName)} ${plan.cappedOut.length > 1 ? 'are' : 'is'} at their limit — only ${plan.eligibleCount ?? 0} eligible (need 4)${weatherLine}</div>`;
      }
      return `<div class="txt-sub">${dateLabel}: only ${plan.available.length} available (need 4) — ${highlightNames(plan.available.map(r => r.name), selectedName)}${weatherLine}</div>`;
    }

    const upcomingPlans = dayPlans.filter(p => !isDayInPast(p));
    const pastPlans = dayPlans.filter(p => isDayInPast(p));

    const dayLines = upcomingPlans.map(renderDayLine).join('');

    const pastLinesHtml = pastPlans.length === 0 ? '' : `
      <div style="border-top:1px solid var(--line); padding-top:8px; margin-top:10px; opacity:0.45;">
        <div style="font-size:11px;color:var(--net-gray);font-family:'Space Mono',monospace;letter-spacing:0.04em;margin-bottom:4px;">EARLIER THIS WEEK</div>
        ${pastPlans.map(plan => {
          const d = weekDays[plan.idx];
          const dateLabel = `${DOW[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;
          let summary;
          if (plan.closed) summary = 'club closed';
          else if (plan.playing.length >= 4) summary = plan.playing.map(r => r.name).join(', ');
          else if (plan.available.length === 0) summary = 'no one available';
          else summary = `only ${plan.available.length} available`;
          return `<div style="font-size:12px;color:var(--chalk);margin-bottom:2px;">${dateLabel}: ${escapeHtml(summary)}</div>`;
        }).join('')}
      </div>`;

    const anyPlayableDay = dayPlans.some(p => p.playing.length >= 4);
    const balanceNote = anyPlayableDay
      ? `Games this week — ${Object.entries(playCountTotal).map(([n, c]) => `${escapeHtml(n)}: ${c}`).join(' · ')}`
      : 'No day has 4 people yet — need more responses to fill the court.';

    bestBannerSlot.innerHTML = `<div class="best-banner">
        <div class="ball"></div>
        <div style="flex:1;">
          <div class="txt-main">This week's lineup</div>
          ${dayLines}
          ${pastLinesHtml}
          <div class="txt-sub" style="margin-top:8px;color:var(--net-gray);">${balanceNote}</div>
          <button type="button" class="copy-lineup-btn" id="copyLineupBtn">Copy lineup to clipboard</button>
          <button type="button" class="copy-lineup-btn" id="downloadGraphicBtn" style="margin-top:8px;">📸 Share weekly graphic</button>
        </div>
      </div>`;

    lastDayPlans = dayPlans;

    bestBannerSlot.querySelectorAll('.add-cal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.idx);
        const plan = lastDayPlans.find(p => p.idx === idx);
        if (!plan) return;
        const d = weekDays[idx];
        const ics = buildICS(
          d,
          getStartTime24(plan),
          END_TIME_24,
          'NSRC Early Birds — Tennis',
          'Playing: ' + plan.playing.map(r => r.name).join(', ')
        );
        downloadICS(ics, `tennis-${isoDate(d)}.ics`);
      });
    });

    const copyBtn = document.getElementById('copyLineupBtn');
    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        const text = buildLineupText(lastDayPlans);
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = 'Copied!';
        } catch (e) {
          copyBtn.textContent = 'Copy failed — select manually';
        }
        setTimeout(() => { copyBtn.textContent = 'Copy lineup to clipboard'; }, 2000);
      });
    }

    const graphicBtn = document.getElementById('downloadGraphicBtn');
    if (graphicBtn) {
      graphicBtn.addEventListener('click', async () => {
        const originalText = graphicBtn.textContent;
        graphicBtn.textContent = 'Generating…';
        try {
          const result = await generateWeeklyGraphic(lastDayPlans);
          graphicBtn.textContent = result === 'shared' ? 'Shared!' : result === 'cancelled' ? originalText : 'Downloaded!';
        } catch (e) {
          graphicBtn.textContent = 'Failed — try again';
          console.error('Graphic generation error:', e);
        }
        setTimeout(() => { graphicBtn.textContent = originalText; }, 2000);
      });
    }
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  async function refresh() {
    const data = await loadData();
    const tag = document.getElementById('lastRefreshedTag');
    const timeLabel = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (!data.ok) {
      if (tag) tag.textContent = `Refresh failed at ${timeLabel} — retrying`;
      return;
    }
    if (data.players) {
      const changed = JSON.stringify(data.players) !== JSON.stringify(PLAYERS);
      if (changed) {
        PLAYERS = data.players;
        recomputeTieRank();
        renderNameOptions();
        if (isAdmin) { renderAdminManagePlayers(); renderAdminManagePayments(); }
      }
      playersInitialized = true;
    } else if (!playersInitialized && PLAYERS.length === 0) {
      // Backend didn't return a player list — likely the function hasn't been
      // redeployed with this feature yet. Fall back to a safe default so the
      // dropdown isn't left permanently empty while that gets sorted out.
      PLAYERS = DEFAULT_PLAYERS_FALLBACK.slice();
      recomputeTieRank();
      renderNameOptions();
    }
    closedDays = data.closedDays;
    actualResults = data.actualResults;
    lastResponses = data.responses;
    renderNameOptions();
    applyClosedDaysToPicker();
    renderBoard(data.responses);
    if (isAdmin) { renderAdminClosedPicker(); renderAdminActualPicker(); }
    if (tag) tag.textContent = `Updated ${timeLabel}`;
    if (!didInitialPopulate && nameSelect.value) {
      populateFormForName(nameSelect.value);
      renderPersonalSnapshot(nameSelect.value);
      didInitialPopulate = true;
    }
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const statusMsg = document.getElementById('statusMsg');
    const isNewSubEntry = nameSelect.value === '__sub__';
    const name = isNewSubEntry ? subNameInput.value.trim() : nameSelect.value;
    if (!name) {
      statusMsg.textContent = isNewSubEntry ? "Enter the sub's name first." : 'Choose your name first.';
      statusMsg.style.color = 'var(--clay)';
      return;
    }
    // A person counts as a sub either because they're using the "+ Add a
    // substitute" flow right now, or because they're editing a response
    // that was already saved as a sub earlier this week (selected from the
    // dropdown) — either way this stays true so they don't quietly get
    // treated as a core player on the next save.
    const existingResponse = lastResponses.find(r => r.name === name);
    const isSub = isNewSubEntry || !!(existingResponse && existingResponse.isSub);
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    statusMsg.textContent = 'Saving...';
    statusMsg.style.color = 'var(--net-gray)';
    try {
      await saveResponse(name, selected, document.getElementById('noteInput').value, isOut, maxStreakInput.value, maxWeeklyInput.value, isSub);
      if (!isNewSubEntry) {
        try { localStorage.setItem(LAST_NAME_KEY, name); } catch (e) { /* ignore */ }
      } else {
        subNameInput.value = '';
        subNameInput.style.display = 'none';
        nameSelect.value = '';
      }
      statusMsg.textContent = isOut ? `Saved — see you next week, ${name}!` : `Saved — thanks, ${name}!`;
      statusMsg.style.color = 'var(--ball-yellow)';
      await refresh();
    } catch (e) {
      statusMsg.textContent = 'Could not save: ' + e.message;
      statusMsg.style.color = 'var(--clay)';
      console.error('Save error:', e);
    }
    btn.disabled = false;
  });

  // ---- Admin panel ----
  const adminSelected = new Set();
  let actualEditDayIdx = null;
  const actualEditSelected = new Set();

  function renderAdminCard() {
    const slot = document.getElementById('adminCardSlot');
    let collapsed = true;
    try { collapsed = localStorage.getItem('tennisAdminCollapsed') !== 'false'; } catch (e) { /* ignore */ }

    slot.innerHTML = `
      <div class="card admin-card">
        <h2 id="adminToggleHeader" style="cursor:pointer;user-select:none;">
          Admin tools <span class="tag admin">Private link</span>
          <span id="adminChevron" style="margin-left:auto;color:var(--net-gray);font-family:'Space Mono',monospace;font-size:12px;">${collapsed ? '▸ show' : '▾ hide'}</span>
        </h2>
        <div id="adminCardBody" style="display:${collapsed ? 'none' : 'block'};">
          <label class="field-label" style="margin-top:22px;">Get notified when someone updates their availability</label>
          <button class="primary admin-btn" id="enablePushBtn">Enable notifications on this device</button>
          <div class="status-msg admin-status" id="pushStatusMsg"></div>

          <label class="field-label" style="margin-top:22px;">Early warning alert timing</label>
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
            <input type="checkbox" id="ewEnabledCheckbox" style="width:auto; margin-bottom:0;">
            <label for="ewEnabledCheckbox" style="font-size:13px; color:var(--chalk);">Enabled</label>
          </div>
          <div style="display:flex; gap:8px; align-items:center;">
            <select id="ewDaySelect" style="margin-bottom:0;">
              <option value="0">Sunday</option>
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
            <select id="ewHourSelect" style="margin-bottom:0;">
              ${Array.from({length: 24}, (_, h) => `<option value="${h}">${h === 0 ? '12am' : h < 12 ? h+'am' : h === 12 ? '12pm' : (h-12)+'pm'}</option>`).join('')}
            </select>
            <button class="primary admin-btn" id="saveEwConfigBtn" style="width:auto; padding:0 16px;">Save</button>
          </div>
          <div class="status-msg admin-status" id="ewConfigStatusMsg"></div>

          <label class="field-label" style="margin-top:22px;">Rotation algorithm <span style="color:var(--net-gray); text-transform:none; font-weight:400;">(affects everyone's projected lineup)</span></label>
          <div style="display:flex; gap:8px; align-items:center;">
            <select id="rotationModeSelect" style="margin-bottom:0;">
              <option value="balanced">Balanced (spreads flexible players later in the week)</option>
              <option value="classic">Classic (original behavior)</option>
            </select>
            <button class="primary admin-btn" id="saveRotationModeBtn" style="width:auto; padding:0 16px;">Save</button>
          </div>
          <div class="status-msg admin-status" id="rotationModeStatusMsg"></div>

          <label class="field-label" style="margin-top:22px;">Manage players</label>
          <div id="managePlayersSlot"></div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <input type="text" id="newPlayerInput" placeholder="New player name" style="flex:1; margin-bottom:0;">
            <button class="primary admin-btn" id="addPlayerBtn" style="width:auto; padding:0 16px;">Add</button>
          </div>
          <div class="status-msg admin-status" id="managePlayersStatusMsg"></div>

          <label class="field-label" style="margin-top:22px;">Manage payments for the ${getCurrentSeasonYear()}–${String(getCurrentSeasonYear() + 1).slice(2)} season <span style="color:var(--net-gray); text-transform:none; font-weight:400;">(defaults to $795 / 12 months — only change exceptions)</span></label>
          <div id="managePaymentsSlot"></div>
          <button class="primary admin-btn" id="savePaymentsBtn" style="margin-top:8px;">Save payments</button>
          <div class="status-msg admin-status" id="managePaymentsStatusMsg"></div>

          <label class="field-label" style="margin-top:22px;">Mark club-closed days this week</label>
          <div class="day-grid" id="adminDayGrid"></div>
          <button class="primary admin-btn" id="saveClosedBtn">Save closed days</button>
          <div class="status-msg admin-status" id="adminStatusMsg"></div>

          <label class="field-label" style="margin-top:22px;">Mark who actually played a day</label>
          <div class="day-grid" id="actualDayGrid"></div>
          <div id="actualPlayersSlot"></div>

          <div class="footer-actions">
            <button class="link-btn" id="clearBtn">Clear all responses for this week</button>
          </div>
        </div>
      </div>`;

    renderAdminManagePlayers();
    renderAdminManagePayments();

    (async () => {
      try {
        const cfg = await fetchEarlyWarningConfig();
        document.getElementById('ewEnabledCheckbox').checked = !!cfg.enabled;
        document.getElementById('ewDaySelect').value = String(cfg.dayOfWeek);
        document.getElementById('ewHourSelect').value = String(cfg.hour);
      } catch (e) { /* leave defaults if this fails to load */ }
    })();

    document.getElementById('saveEwConfigBtn').addEventListener('click', async () => {
      const msg = document.getElementById('ewConfigStatusMsg');
      msg.textContent = 'Saving...';
      msg.style.color = 'var(--net-gray)';
      try {
        const enabled = document.getElementById('ewEnabledCheckbox').checked;
        const dayOfWeek = Number(document.getElementById('ewDaySelect').value);
        const hour = Number(document.getElementById('ewHourSelect').value);
        await saveEarlyWarningConfig(enabled, dayOfWeek, hour);
        msg.textContent = 'Saved.';
        msg.style.color = 'var(--ball-yellow)';
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
        msg.style.color = 'var(--clay)';
      }
    });

    (async () => {
      try {
        document.getElementById('rotationModeSelect').value = rotationMode;
      } catch (e) { /* leave default if this fails to load */ }
    })();

    document.getElementById('saveRotationModeBtn').addEventListener('click', async () => {
      const msg = document.getElementById('rotationModeStatusMsg');
      msg.textContent = 'Saving...';
      msg.style.color = 'var(--net-gray)';
      try {
        const mode = document.getElementById('rotationModeSelect').value;
        await saveRotationMode(mode);
        rotationMode = mode;
        msg.textContent = 'Saved. Everyone will see the updated projection on next refresh.';
        msg.style.color = 'var(--ball-yellow)';
        await refresh();
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
        msg.style.color = 'var(--clay)';
      }
    });

    document.getElementById('addPlayerBtn').addEventListener('click', async () => {
      const input = document.getElementById('newPlayerInput');
      const msg = document.getElementById('managePlayersStatusMsg');
      const name = input.value.trim();
      if (!name) { msg.textContent = 'Enter a name first.'; msg.style.color = 'var(--clay)'; return; }
      msg.textContent = 'Adding...';
      msg.style.color = 'var(--net-gray)';
      try {
        await addPlayerRequest(name);
        input.value = '';
        msg.textContent = `Added ${name}.`;
        msg.style.color = 'var(--ball-yellow)';
        await refresh();
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
        msg.style.color = 'var(--clay)';
      }
    });

    document.getElementById('savePaymentsBtn').addEventListener('click', async () => {
      const msg = document.getElementById('managePaymentsStatusMsg');
      msg.textContent = 'Saving...';
      msg.style.color = 'var(--net-gray)';
      const paymentsMap = {};
      document.querySelectorAll('#managePaymentsSlot .payment-row').forEach(row => {
        const name = row.dataset.name;
        const amount = Number(row.querySelector('.payment-amount').value) || 795;
        const months = Number(row.querySelector('.payment-months').value) || 12;
        paymentsMap[name] = { amount, months };
      });
      try {
        await savePaymentsRequest(paymentsMap);
        msg.textContent = 'Saved.';
        msg.style.color = 'var(--ball-yellow)';
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
        msg.style.color = 'var(--clay)';
      }
    });

    document.getElementById('adminToggleHeader').addEventListener('click', () => {
      const body = document.getElementById('adminCardBody');
      const chevron = document.getElementById('adminChevron');
      const nowCollapsed = body.style.display !== 'none';
      body.style.display = nowCollapsed ? 'none' : 'block';
      chevron.textContent = nowCollapsed ? '▸ show' : '▾ hide';
      try { localStorage.setItem('tennisAdminCollapsed', String(nowCollapsed)); } catch (e) { /* ignore */ }
    });

    document.getElementById('enablePushBtn').addEventListener('click', async () => {
      const msg = document.getElementById('pushStatusMsg');
      msg.textContent = 'Enabling...';
      msg.style.color = 'var(--net-gray)';
      try {
        await enablePushNotifications();
        msg.textContent = 'Notifications enabled on this device.';
        msg.style.color = 'var(--ball-yellow)';
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
        msg.style.color = 'var(--clay)';
      }
    });

    const adminDayGrid = document.getElementById('adminDayGrid');
    weekDays.forEach((d, idx) => {
      const chip = document.createElement('div');
      chip.className = 'day-chip admin-select';
      chip.innerHTML = `<span class="dow">${DOW[d.getDay()]}</span><span class="dnum">${d.getDate()}</span>`;
      chip.addEventListener('click', () => {
        if (adminSelected.has(idx)) { adminSelected.delete(idx); chip.classList.remove('selected'); }
        else { adminSelected.add(idx); chip.classList.add('selected'); }
      });
      adminDayGrid.appendChild(chip);
    });

    document.getElementById('saveClosedBtn').addEventListener('click', async () => {
      const msg = document.getElementById('adminStatusMsg');
      msg.textContent = 'Saving...';
      try {
        await saveClosedDays(Array.from(adminSelected));
        msg.textContent = 'Saved.';
        await refresh();
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
      }
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (!confirm("Clear everyone's responses for this week? This cannot be undone.")) return;
      const msg = document.getElementById('adminStatusMsg');
      try {
        await clearAllResponses();
        msg.textContent = 'Cleared.';
        await refresh();
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
      }
    });

    const actualDayGrid = document.getElementById('actualDayGrid');
    weekDays.forEach((d, idx) => {
      const chip = document.createElement('div');
      chip.className = 'day-chip admin-select';
      chip.innerHTML = `<span class="dow">${DOW[d.getDay()]}</span><span class="dnum">${d.getDate()}</span>`;
      chip.addEventListener('click', () => selectActualEditDay(idx));
      actualDayGrid.appendChild(chip);
    });
  }

  function selectActualEditDay(idx) {
    actualEditDayIdx = idx;
    const chips = document.querySelectorAll('#actualDayGrid .day-chip');
    chips.forEach((chip, i) => chip.classList.toggle('selected', i === idx));

    actualEditSelected.clear();
    const existing = actualResults[String(idx)];
    if (existing) existing.forEach(n => actualEditSelected.add(n));

    const slot = document.getElementById('actualPlayersSlot');
    slot.innerHTML = `
      <div style="margin-top:10px;">
        <div class="day-grid" id="actualPlayerChips" style="grid-template-columns: repeat(4, 1fr);"></div>
        <button class="primary admin-btn" id="saveActualBtn" style="margin-top:10px;">Save actual result for this day</button>
        <button class="link-btn" id="clearActualBtn" style="display:block;margin-top:6px;">Clear recorded result (go back to projection)</button>
        <div class="status-msg admin-status" id="actualStatusMsg"></div>
      </div>`;

    const chipGrid = document.getElementById('actualPlayerChips');
    PLAYERS.forEach(name => {
      const chip = document.createElement('div');
      chip.className = 'day-chip admin-select';
      chip.style.padding = '10px 4px';
      chip.innerHTML = `<span class="dnum" style="font-size:13px;">${escapeHtml(name)}</span>`;
      chip.classList.toggle('selected', actualEditSelected.has(name));
      chip.addEventListener('click', () => {
        if (actualEditSelected.has(name)) { actualEditSelected.delete(name); chip.classList.remove('selected'); }
        else { actualEditSelected.add(name); chip.classList.add('selected'); }
      });
      chipGrid.appendChild(chip);
    });

    document.getElementById('saveActualBtn').addEventListener('click', async () => {
      const msg = document.getElementById('actualStatusMsg');
      msg.textContent = 'Saving...';
      try {
        await saveActualResult(actualEditDayIdx, Array.from(actualEditSelected));
        msg.textContent = 'Saved.';
        await refresh();
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
      }
    });

    document.getElementById('clearActualBtn').addEventListener('click', async () => {
      const msg = document.getElementById('actualStatusMsg');
      msg.textContent = 'Clearing...';
      try {
        await saveActualResult(actualEditDayIdx, []);
        msg.textContent = 'Cleared — back to projection.';
        await refresh();
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
      }
    });
  }

  function renderAdminManagePlayers() {
    const slot = document.getElementById('managePlayersSlot');
    if (!slot) return;
    slot.innerHTML = PLAYERS.map(name => `
      <span style="display:inline-flex; align-items:center; gap:5px; background:var(--court-navy-deep); border:1px solid var(--line); border-radius:100px; padding:5px 6px 5px 12px; margin:0 6px 6px 0; font-size:13px;">
        ${escapeHtml(name)}
        <button type="button" class="remove-player-btn" data-name="${escapeHtml(name)}" style="background:var(--clay); color:var(--chalk); border:none; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:1; cursor:pointer;">×</button>
      </span>
    `).join('');

    slot.querySelectorAll('.remove-player-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const name = btn.dataset.name;
        if (!confirm(`Remove ${name} from the player list? Their past responses stay on record, but they won't appear in the dropdown anymore.`)) return;
        const msg = document.getElementById('managePlayersStatusMsg');
        msg.textContent = 'Removing...';
        msg.style.color = 'var(--net-gray)';
        try {
          await removePlayerRequest(name);
          msg.textContent = `Removed ${name}.`;
          msg.style.color = 'var(--ball-yellow)';
          await refresh();
        } catch (e) {
          msg.textContent = 'Error: ' + e.message;
          msg.style.color = 'var(--clay)';
        }
      });
    });
  }

  async function renderAdminManagePayments() {
    const slot = document.getElementById('managePaymentsSlot');
    if (!slot) return;
    const payments = await fetchPayments();
    slot.innerHTML = PLAYERS.map(name => {
      const p = payments[name] || { amount: 795, months: 12 };
      return `
      <div class="payment-row" data-name="${escapeHtml(name)}">
        <span class="payment-name">${escapeHtml(name)}</span>
        <span class="payment-label">$</span>
        <input type="number" class="payment-amount" value="${p.amount}" min="0" step="1">
        <span class="payment-label">mo.</span>
        <input type="number" class="payment-months" value="${p.months}" min="1" max="12" step="1">
      </div>`;
    }).join('');
  }

  function renderAdminActualPicker() {
    const chips = document.querySelectorAll('#actualDayGrid .day-chip');
    if (chips.length === 0) return;
    chips.forEach((chip, idx) => {
      const hasActual = !!actualResults[String(idx)];
      chip.classList.toggle('closed-chip', false);
      chip.style.borderColor = hasActual ? 'var(--ball-yellow-dim)' : '';
      chip.style.opacity = hasActual ? '1' : '';
    });
  }

  function renderAdminClosedPicker() {
    const chips = document.querySelectorAll('#adminDayGrid .day-chip');
    chips.forEach((chip, idx) => {
      const on = closedDays.includes(idx);
      chip.classList.toggle('selected', on);
      if (on) adminSelected.add(idx); else adminSelected.delete(idx);
    });
  }

  if (isAdmin) {
    renderAdminCard();
  }

  fetchRotationMode().then(mode => { rotationMode = mode; refresh(); }).catch(() => { refresh(); });
  fetchWeather();

  // Auto-refresh the board periodically so people see live updates without
  // reloading. Paused while the tab is hidden/backgrounded to avoid wasted
  // requests, and resumed (with an immediate refresh) when it becomes visible.
  const POLL_INTERVAL_MS = 45000;
  let pollHandle = null;

  function startPolling() {
    if (pollHandle) return;
    pollHandle = setInterval(refresh, POLL_INTERVAL_MS);
  }

  function stopPolling() {
    if (pollHandle) {
      clearInterval(pollHandle);
      pollHandle = null;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      refresh();
      startPolling();
    } else {
      stopPolling();
    }
  });

  startPolling();
})();
</script>
</body>
</html>
